<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>
    <ul>
        {% for inventory in products_with_stock %}
            <li>
                {{ inventory.product.name }}: {{ inventory.stock_level }} in stock
            </li>
        {% endfor %}
    </ul>
</body>
</html>
