{% extends 'base.html' %}

{% block title %}
Error
{% endblock %}

{% block content %}
<h1 class="text-center">Something Went Wrong</h1>

<!-- Display the error message -->
<div class="form-errors mt-20 mb-20 p-10">
    <p>{{ message }}</p>
</div>

<!-- Provide a link to go back to the previous page -->
<p class="text-center">
    <a href="javascript:history.back()" class="button">Go Back</a>
</p>
{% endblock %}
