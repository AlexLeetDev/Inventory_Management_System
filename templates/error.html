<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            background-color: #f8d7da;
            padding: 20px;
            max-width: 500px;
            margin: 50px auto;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Oops! Something went wrong.</h1>
        <p>{{ message }}</p>
    </div>
</body>
</html>
